<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麟阁 MemHall · 智能体记忆评测</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#0f172a; --sub:#64748b;
  --acc:#0e7490; --acc-soft:#e0f2f7; --line:#e2e8f0;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --purple:#7c3aed; --dim:#94a3b8;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#f6f9fa 0%,#eef2f6 60%,#e8f0f1 100%);
  color:var(--ink);min-height:100vh;
}
.app{max-width:1120px;margin:0 auto;padding:22px 26px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:10px 4px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  font-size:24px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#0e7490,#0f766e 55%,#14b8a6);
  box-shadow:0 6px 18px rgba(14,116,144,.35)}
.brand h1{font-size:20px;letter-spacing:.5px}
.brand p{font-size:12.5px;color:var(--sub);margin-top:2px}
nav{display:flex;gap:4px;position:relative;background:var(--card);
  padding:5px;border-radius:14px;border:1px solid var(--line);
  box-shadow:0 2px 10px rgba(15,23,42,.05)}
nav button{border:0;background:transparent;padding:9px 20px;font-size:14.5px;
  color:var(--sub);cursor:pointer;border-radius:10px;transition:color .2s;font-weight:500}
nav button:hover{color:var(--ink)}
nav button.on{color:#fff}
.nav-ink{position:absolute;top:5px;left:0;height:calc(100% - 10px);border-radius:10px;
  background:linear-gradient(135deg,#0e7490,#0f766e);z-index:0;pointer-events:none}
nav button{position:relative;z-index:1}
main{min-height:420px}
.tab{display:none}
.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:20px 22px;box-shadow:0 2px 12px rgba(15,23,42,.05)}
h2.sec{font-size:15px;color:var(--sub);font-weight:600;margin:26px 2px 12px;
  display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:4px;height:16px;border-radius:2px;
  background:linear-gradient(#0e7490,#14b8a6)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:13px;padding:13px 15px;
  background:#fbfdfe;transition:transform .18s,box-shadow .18s}
.mini:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08)}
.mini .name{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.mini .meta{font-size:12.5px;color:var(--sub);margin-top:5px;
  font-family:var(--mono);word-break:break-all}
.mini.ghost{opacity:.55;border-style:dashed;background:transparent}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.y{background:var(--ok);box-shadow:0 0 8px rgba(22,163,74,.55)}
.dot.n{background:#cbd5e1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
  padding:3px 10px;border-radius:99px;font-weight:600}
.pill.ok{background:#e8f7ee;color:var(--ok)}
.pill.warn{background:#fdf3e3;color:var(--warn)}
.pill.bad{background:#fdeaea;color:var(--bad)}
.pill.info{background:var(--acc-soft);color:var(--acc)}
.pill.dim{background:#f1f5f9;color:var(--dim)}
.pill.purple{background:#f1e9fd;color:var(--purple)}
.envrow{display:flex;align-items:center;gap:12px;padding:10px 6px;
  border-bottom:1px dashed var(--line);font-size:14px}
.envrow:last-child{border-bottom:0}
.envrow .n{width:150px;color:var(--ink);font-weight:500}
.usable{margin-top:16px;padding:13px 16px;border-radius:12px;
  background:linear-gradient(90deg,var(--acc-soft),transparent);
  border-left:3px solid var(--acc);font-size:13.5px;color:#155e75}
button.act{border:0;border-radius:11px;padding:10px 22px;font-size:14.5px;
  font-weight:600;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#0e7490,#0f766e);
  box-shadow:0 4px 14px rgba(14,116,144,.3);transition:transform .15s,box-shadow .15s}
button.act:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(14,116,144,.4)}
button.act:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.ghostbtn{border:1px solid var(--line);background:var(--card);color:var(--sub);
  border-radius:11px;padding:10px 18px;font-size:14px;cursor:pointer;transition:all .15s}
button.ghostbtn:hover:not(:disabled){color:var(--bad);border-color:var(--bad)}
button.ghostbtn:disabled{opacity:.4;cursor:not-allowed}
.formrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--sub);font-weight:600}
select,input[type=text],input[type=password]{
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;
  background:#fff;color:var(--ink);min-width:170px;outline:0;transition:border .15s,box-shadow .15s}
select:focus,input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(14,116,144,.14)}
.progress-wrap{margin:20px 0 12px}
.progress-meta{display:flex;justify-content:space-between;font-size:13px;
  color:var(--sub);margin-bottom:7px}
.progress{height:12px;border-radius:99px;background:#e6edf2;overflow:hidden;position:relative}
.progress > i{display:block;height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#0e7490,#14b8a6);position:relative;transition:none}
.progress > i::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);
  animation:shimmer 1.6s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.console{background:#0b1220;border-radius:13px;padding:14px 16px;height:300px;
  overflow-y:auto;font-family:var(--mono);font-size:12.5px;line-height:1.75;
  color:#cbd5e1;box-shadow:inset 0 2px 10px rgba(0,0,0,.4)}
.console .t{color:#475569;margin-right:8px}
.console .lv-start{color:#38bdf8}.console .lv-case{color:#a5f3c4}
.console .lv-phase{color:#fbbf24}.console .lv-done{color:#34d399;font-weight:700}
.console .lv-stopped{color:#fbbf24}.console .lv-error{color:#f87171}
.console .lv-info{color:#94a3b8}
.result{margin-top:18px;display:none}
.score-big{font-size:44px;font-weight:800;
  background:linear-gradient(90deg,#0e7490,#14b8a6);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.capbars{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.capbar{display:grid;grid-template-columns:90px 1fr 52px;align-items:center;gap:12px;font-size:13.5px}
.capbar .track{height:9px;background:#e6edf2;border-radius:99px;overflow:hidden}
.capbar .track i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#0e7490,#14b8a6)}
.capbar .v{font-family:var(--mono);color:var(--sub);text-align:right}
.runs-table{width:100%;border-collapse:collapse;font-size:13.5px}
.runs-table th{text-align:left;color:var(--sub);font-weight:600;font-size:12.5px;
  padding:8px 10px;border-bottom:1px solid var(--line)}
.runs-table td{padding:9px 10px;border-bottom:1px dashed var(--line)}
.runs-table tr.row{cursor:pointer;transition:background .15s}
.runs-table tr.row:hover{background:#f4fafb}
.runs-table tr.sel{background:var(--acc-soft)}
.mono{font-family:var(--mono)}
.report-detail{display:none;margin-top:18px}
.radar-box{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.radar-box img{max-width:430px;border-radius:13px;border:1px solid var(--line);
  background:#fff;box-shadow:0 4px 16px rgba(15,23,42,.07)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;
  padding:5px 13px;font-size:12.5px;cursor:pointer;color:var(--sub);transition:all .15s}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.verdict-table{width:100%;border-collapse:collapse;font-size:13px}
.verdict-table th{text-align:left;padding:7px 9px;color:var(--sub);font-size:12px;
  border-bottom:1px solid var(--line)}
.verdict-table td{padding:7px 9px;border-bottom:1px dashed var(--line);vertical-align:top}
.verdict-table td.exp{color:var(--sub);max-width:430px}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cfg-item{display:flex;flex-direction:column;gap:6px}
.cfg-item label{font-size:12.5px;color:var(--sub);font-weight:600;font-family:var(--mono)}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:11px 22px;border-radius:12px;font-size:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;z-index:99}
.empty{color:var(--dim);font-size:13.5px;padding:18px 4px}
.compare-bar{display:none;align-items:center;gap:12px;margin-bottom:12px}
footer{margin-top:36px;text-align:center;color:#94a3b8;font-size:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
  border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">麟</div>
      <div><h1>麟阁 MemHall</h1><p>面向 openKylin 生态的智能体记忆能力评测基准</p></div>
    </div>
    <nav id="nav">
      <span class="nav-ink" id="navInk"></span>
      <button data-tab="doctor" class="on">体检</button>
      <button data-tab="run">评测</button>
      <button data-tab="report">报告</button>
      <button data-tab="config">配置</button>
    </nav>
  </header>

  <main>
    <!-- 体检 -->
    <section id="tab-doctor" class="tab on">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700;font-size:16px">环境体检
            <span style="font-weight:400;font-size:12.5px;color:var(--sub)">　一键发现本机 / 评测机智能体</span></div>
          <button class="ghostbtn" id="docRefresh" style="color:var(--acc);border-color:var(--acc)">重新体检</button>
        </div>
        <div id="docBody"><div class="empty"><span class="spin"></span> 探测中…（评测机 SSH 探测约需数秒）</div></div>
      </div>
    </section>

    <!-- 评测 -->
    <section id="tab-run" class="tab">
      <div class="card">
        <div class="formrow">
          <div class="field"><label>被测智能体</label>
            <select id="fAdapter"><option value="mock">mock（离线演示）</option>
              <option value="hermes">hermes</option><option value="kylinbot">kylinbot</option></select></div>
          <div class="field"><label>用例集</label><select id="fCases"></select></div>
          <div class="field"><label>判卷</label>
            <select id="fJudge"><option value="scripted">脚本判卷（离线）</option>
              <option value="dual">LLM 判卷（qwen 单判）</option></select></div>
          <button class="act" id="btnStart">开始评测</button>
          <button class="ghostbtn" id="btnStop" disabled>停止</button>
        </div>
        <div class="progress-wrap">
          <div class="progress-meta"><span id="progLabel">待命</span><span id="progCount"></span></div>
          <div class="progress"><i id="progBar"></i></div>
        </div>
        <div class="console" id="console"><div><span class="t">--:--:--</span><span class="lv-info">就绪。点击「开始评测」跑一轮三阶段剧本（教 → 隔 → 考）。</span></div></div>
        <div class="result card" id="resultCard" style="background:linear-gradient(135deg,#f0fafb,#fff)">
          <div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap">
            <div><div style="font-size:12.5px;color:var(--sub);font-weight:600">总体正确率</div>
              <div class="score-big" id="resScore">0%</div>
              <div style="font-size:12.5px;color:var(--sub)" id="resValid"></div></div>
            <div style="flex:1;min-width:280px"><div class="capbars" id="resCaps"></div></div>
            <button class="act" id="btnToReport">查看完整报告 →</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 报告 -->
    <section id="tab-report" class="tab">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:700;font-size:16px">历史运行</div>
          <button class="ghostbtn" id="runsRefresh" style="color:var(--acc);border-color:var(--acc)">刷新</button>
        </div>
        <div class="compare-bar" id="compareBar">
          <span style="font-size:13px;color:var(--sub)">已选 <b id="cmpNames"></b></span>
          <button class="act" id="btnCompare" style="padding:8px 18px;font-size:13.5px">生成对比雷达</button>
        </div>
        <div id="runsList"><div class="empty">加载中…</div></div>
      </div>
      <div class="card report-detail" id="reportDetail">
        <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px">
          <div><span class="mono" id="rdRunId" style="font-size:15px;font-weight:700"></span>
            <span id="rdAdapter" class="pill info" style="margin-left:10px"></span></div>
          <div style="display:flex;align-items:baseline;gap:8px">
            <span style="font-size:12.5px;color:var(--sub)">总体</span>
            <span class="score-big" id="rdScore" style="font-size:34px">0%</span></div>
        </div>
        <div class="radar-box" style="margin-top:16px">
          <img id="rdRadar" alt="六维能力雷达图">
          <div style="flex:1;min-width:260px">
            <div style="font-size:13px;color:var(--sub);font-weight:600;margin-bottom:8px">六维能力</div>
            <div class="capbars" id="rdCaps"></div>
          </div>
        </div>
        <h2.sec style="margin-top:24px">判定明细</h2>
        <div class="chips" id="vChips"></div>
        <table class="verdict-table"><thead><tr>
          <th>探测点</th><th>能力</th><th>判定</th><th>判卷</th><th>说明</th></tr></thead>
          <tbody id="vBody"></tbody></table>
      </div>
    </section>

    <!-- 配置 -->
    <section id="tab-config" class="tab">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div><div style="font-weight:700;font-size:16px">运行配置</div>
            <div style="font-size:12.5px;color:var(--sub);margin-top:3px">
              写入 <span class="mono" id="cfgPath"></span>（不入 git）；密钥只回显"已设置"，留空即保持不变</div></div>
          <button class="act" id="btnSaveCfg">保存配置</button>
        </div>
        <h2.sec>评测机（SSH）</h2><div class="cfg-grid" id="cfgVM"></div>
        <h2.sec>被测智能体 LLM 网关</h2><div class="cfg-grid" id="cfgAgent"></div>
        <h2.sec>判卷 LLM</h2><div class="cfg-grid" id="cfgJudge"></div>
        <h2.sec>节流</h2><div class="cfg-grid" id="cfgMisc"></div>
      </div>
    </section>
  </main>
  <footer>麟阁 MemHall · 本地服务 127.0.0.1 · 三阶段剧本（教→隔→考）· 证据可下钻</footer>
</div>
<div id="toast"></div>
<script src="/static/gsap.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const G=window.gsap||null;
const CAPS={persist:"长期保持",recall:"记忆调用",dynamic_update:"动态更新",
  discriminate:"相近区分",boundary:"边界识别",reuse:"任务复用"};
const VMETA={correct:["正确","ok"],omission:["遗漏","dim"],confusion:["混淆","warn"],
  over_persist:["错误持久化","bad"],wrong_reuse:["错误复用","purple"],invalid_run:["无效","dim"]};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=x=>(x*100).toFixed(1)+"%";
const fmtCap=k=>CAPS[k]||k;

/* ---------- GSAP 动效封装 ---------- */
function staggerIn(nodes,opts={}){
  if(!G){return}
  g_from(nodes,{y:opts.y??16,opacity:0,scale:opts.scale??1,duration:.42,
    stagger:opts.stagger??.06,ease:"power3.out",overwrite:"auto"});
}
function g_from(t,v){G.from(t,v)}
function g_to(t,v){G.to(t,v)}
function popIn(nodes){
  if(!G){return}
  G.from(nodes,{scale:.85,opacity:0,y:10,duration:.4,ease:"back.out(1.8)",stagger:.05});
}
function countUp(el,val,fmt){
  if(!G){el.textContent=fmt(val);return}
  const o={v:0};
  G.to(o,{v:val,duration:1.1,ease:"power2.out",
    onUpdate:()=>{el.textContent=fmt(o.v)}});
}
function toast(msg){
  const t=$("#toast");t.textContent=msg;
  if(!G){t.style.opacity=1;t.style.transform="translateX(-50%)";setTimeout(()=>{t.style.opacity=0},2200);return}
  G.killTweensOf(t);
  G.timeline().to(t,{opacity:1,y:0,x:"-50%",duration:.35,ease:"power3.out"})
    .to(t,{opacity:0,y:80,duration:.4,ease:"power2.in",delay:1.8});
}
function animBars(wrap,caps){
  wrap.innerHTML=Object.entries(caps).map(([k,v])=>`
    <div class="capbar"><span>${fmtCap(k)}</span>
      <span class="track"><i data-w="${v}"></i></span><span class="v">${pct(v)}</span></div>`).join("");
  const bars=wrap.querySelectorAll(".track i");
  if(!G){bars.forEach(b=>b.style.width=(b.dataset.w*100)+"%");return}
  G.to(bars,{width:(i,el)=>(+el.dataset.w*100)+"%",duration:.9,ease:"power4.out",stagger:.07});
}

/* ---------- Tab 切换 ---------- */
const ink=$("#navInk");
function moveInk(btn){if(!G){return}
  g_to(ink,{x:btn.offsetLeft,width:btn.offsetWidth,duration:.45,ease:"elastic.out(1,0.6)"});}
function initInk(){const b=$('#nav button.on');ink.style.width=b.offsetWidth+"px";
  ink.style.left=b.offsetLeft+"px";}
function switchTab(name){
  $$('#nav button').forEach(b=>b.classList.toggle("on",b.dataset.tab===name));
  $$(".tab").forEach(s=>s.classList.toggle("on",s.id==="tab-"+name));
  const btn=$(`#nav button[data-tab="${name}"]`);moveInk(btn);
  const sec=$("#tab-"+name);
  const cards=sec.querySelectorAll(".card");
  if(G){G.fromTo(cards,{y:18,opacity:0},{y:0,opacity:1,duration:.45,ease:"power3.out",stagger:.08,overwrite:true});}
  if(name==="doctor"&&!doctorLoaded){loadDoctor();}
  if(name==="report"){loadRuns();}
  if(name==="config"&&!cfgLoaded){loadConfig();}
}
$$("#nav button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));

/* ---------- 体检 ---------- */
let doctorLoaded=false;
async function loadDoctor(){
  const body=$("#docBody");
  body.innerHTML='<div class="empty"><span class="spin"></span> 探测中…</div>';
  try{
    const d=await api("/api/doctor");
    doctorLoaded=true;
    const cardRow=(f)=>`
      <div class="mini ${f.found?"":"ghost"}">
        <div class="name"><span class="dot ${f.found?"y":"n"}"></span>${esc(f.name)}
          ${f.adapter?`<span class="pill info">-a ${esc(f.adapter)}</span>`:
            f.found?`<span class="pill dim">无适配器·可定制</span>`:""}</div>
        <div class="meta">${f.found?esc((f.version?f.version+" · ":"")+(f.detail||"")+(f.hint?" · "+f.hint:"")):"未检出"}</div>
      </div>`;
    const envRow=(c)=>`
      <div class="envrow"><span class="n">${esc(c.name)}</span>
        <span class="pill ${c.ok?"ok":"warn"}">${c.ok?"✓ 通过":"✗ 未就绪"}</span>
        <span style="color:var(--sub);font-size:13px" class="mono">${esc(c.detail||"")}</span></div>`;
    body.innerHTML=`
      <h2.sec>本机智能体</h2><div class="grid-cards" id="dgLocal">${d.local.map(cardRow).join("")}</div>
      <h2.sec>评测机智能体（openKylin VM）</h2>
      ${d.vm_error?`<div class="empty">⚠ ${esc(d.vm_error)}</div>`:
        `<div class="grid-cards" id="dgVm">${d.vm.map(cardRow).join("")||'<div class="empty">未发现</div>'}</div>`}
      <h2.sec>评测环境就绪度</h2><div class="card" style="box-shadow:none;padding:6px 18px">${d.env.map(envRow).join("")}</div>
      <div class="usable">可用适配器：<b>${d.usable.join("、")}</b>　→　评测页选择适配器即可开跑</div>`;
    staggerIn(body.querySelectorAll(".mini"),{y:14,stagger:.05});
    popIn(body.querySelectorAll(".pill"));
    if(G){G.from(body.querySelectorAll(".envrow"),{x:-14,opacity:0,duration:.35,stagger:.06,ease:"power2.out"});}
  }catch(e){body.innerHTML=`<div class="empty">体检失败：${esc(e.message)}</div>`;}
}
$("#docRefresh").addEventListener("click",loadDoctor);

/* ---------- 评测 ---------- */
async function loadCaseDirs(){
  try{const d=await api("/api/case-dirs");
    $("#fCases").innerHTML=d.dirs.map(x=>`<option>${esc(x)}</option>`).join("");
  }catch(e){$("#fCases").innerHTML='<option>cases/full</option>';}
}
function logLine(cls,msg){
  const c=$("#console");
  const t=new Date().toTimeString().slice(0,8);
  const div=document.createElement("div");
  div.innerHTML=`<span class="t">${t}</span><span class="${cls}">${esc(msg)}</span>`;
  c.appendChild(div);
  if(G){G.from(div,{y:8,opacity:0,duration:.25,ease:"power2.out"});}
  c.scrollTop=c.scrollHeight;
}
let es=null;
$("#btnStart").addEventListener("click",async()=>{
  const body={adapter:$("#fAdapter").value,cases:$("#fCases").value,judge:$("#fJudge").value};
  try{await api("/api/start",{method:"POST",body:JSON.stringify(body)})}
  catch(e){
    if(e.status===409){toast("已有评测在跑");}else{toast("启动失败："+e.message);}return}
  $("#btnStart").disabled=true;$("#btnStop").disabled=false;
  $("#resultCard").style.display="none";
  $("#progLabel").textContent="启动中…";$("#progCount").textContent="";
  if(G){g_to("#progBar",{width:"2%",duration:.4});}else{$("#progBar").style.width="2%"}
  if(es){es.close()}
  es=new EventSource("/api/events");
  es.onmessage=(ev)=>{
    const m=JSON.parse(ev.data);
    if(m.type==="start"){logLine("lv-start",`开始评测：${m.adapter} × ${m.cases}（${m.n_cases} 用例，${m.judge==="dual"?"LLM 判卷":"脚本判卷"}）`);}
    else if(m.type==="case"){
      logLine("lv-case",`[${m.i}/${m.n}] ${m.case} 完成`);
      $("#progLabel").textContent=`${m.case}`;
      $("#progCount").textContent=`${m.i} / ${m.n}`;
      const w=(m.i/m.n*100).toFixed(1)+"%";
      if(G){g_to("#progBar",{width:w,duration:.5,ease:"power2.out"});}else{$("#progBar").style.width=w}
    }
    else if(m.type==="phase"){logLine("lv-phase",m.msg);}
    else if(m.type==="done"){
      pendingRunId=m.run_id;
      logLine("lv-done",`完成：总体正确率 ${pct(m.score)}（有效 ${m.n_valid}/${m.n_total}）`);
      if(G){g_to("#progBar",{width:"100%",duration:.6,ease:"power3.out"});}else{$("#progBar").style.width="100%"}
      $("#progLabel").textContent="评测完成";
      showResult(m);finishRun();
    }
    else if(m.type==="stopped"){logLine("lv-stopped",m.msg);finishRun();}
    else if(m.type==="error"){logLine("lv-error",m.msg);finishRun();}
  };
});
$("#btnStop").addEventListener("click",async()=>{
  await api("/api/stop",{method:"POST"});logLine("lv-stopped","已请求停止（当前用例完成后生效）");
  $("#btnStop").disabled=true;
});
function finishRun(){$("#btnStart").disabled=false;$("#btnStop").disabled=true;
  if(es){es.close();es=null;}}
function showResult(m){
  const rc=$("#resultCard");rc.style.display="block";
  $("#resValid").textContent=`有效 ${m.n_valid} / ${m.n_total} 探测点`;
  countUp($("#resScore"),m.score,v=>pct(v));
  animBars($("#resCaps"),m.caps);
  if(G){G.fromTo(rc,{y:22,opacity:0,scale:.98},{y:0,opacity:1,scale:1,duration:.55,ease:"back.out(1.4)"});
    G.fromTo("#resScore",{scale:1.18},{scale:1,duration:.6,ease:"elastic.out(1,.5)",delay:.5});}
}
let pendingRunId=null;
$("#btnToReport").addEventListener("click",()=>{switchTab("report")});

/* ---------- 报告 ---------- */
let compareSel=[];
async function loadRuns(){
  const list=$("#runsList");
  try{
    const d=await api("/api/runs");
    if(!d.runs.length){list.innerHTML='<div class="empty">还没有运行记录——去「评测」页跑一轮。</div>';return}
    list.innerHTML=`<table class="runs-table"><thead><tr>
      <th style="width:34px"></th><th>run_id</th><th>适配器</th><th>总体</th><th>有效</th></tr></thead>
      <tbody>${d.runs.map(r=>`
        <tr class="row" data-id="${esc(r.run_id)}">
          <td><input type="checkbox" class="cmpck" data-id="${esc(r.run_id)}" data-adapter="${esc(r.adapter)}"
            ${compareSel.includes(r.run_id)?"checked":""}></td>
          <td class="mono">${esc(r.run_id)}</td>
          <td><span class="pill ${r.adapter==="mock"?"dim":"info"}">${esc(r.adapter)}</span></td>
          <td><b>${r.score==null?"—":pct(r.score)}</b></td>
          <td style="color:var(--sub)">${r.n_valid==null?"—":`${r.n_valid}/${r.n_total}`}</td></tr>`).join("")}
      </tbody></table>`;
    staggerIn(list.querySelectorAll("tr.row"),{y:10,stagger:.035});
    list.querySelectorAll("tr.row").forEach(tr=>tr.addEventListener("click",e=>{
      if(e.target.closest(".cmpck"))return;
      selectRun(tr.dataset.id);}));
    list.querySelectorAll(".cmpck").forEach(ck=>ck.addEventListener("change",onCompareTick));
    updateCompareBar();
    if(pendingRunId){selectRun(pendingRunId);pendingRunId=null;}
  }catch(e){list.innerHTML=`<div class="empty">加载失败：${esc(e.message)}</div>`;}
}
$("#runsRefresh").addEventListener("click",loadRuns);
function onCompareTick(e){
  const id=e.target.dataset.id;
  if(e.target.checked){compareSel.push(id);
    if(compareSel.length>2){const drop=compareSel.shift();
      const ck=$(`.cmpck[data-id="${CSS.escape(drop)}"]`);if(ck)ck.checked=false;}}
  else{compareSel=compareSel.filter(x=>x!==id);}
  updateCompareBar();
}
function updateCompareBar(){
  const bar=$("#compareBar");
  bar.style.display=compareSel.length===2?"flex":"none";
  if(compareSel.length===2){
    const names=compareSel.map(id=>{
      const tr=$(`tr.row[data-id="${CSS.escape(id)}"]`);
      return tr?tr.querySelector(".pill").textContent:id;}).join(" vs ");
    $("#cmpNames").textContent=names;
    popIn(bar);
  }
}
$("#btnCompare").addEventListener("click",()=>{
  const img=$("#rdRadar");
  img.src=`/api/compare?runs=${encodeURIComponent(compareSel.join(","))}&t=${Date.now()}`;
  $("#reportDetail").style.display="block";
  if(G){G.fromTo(img,{scale:.94,opacity:0},{scale:1,opacity:1,duration:.55,ease:"power3.out"});}
});
let vFilter="all";
async function selectRun(runId){
  compareSel=[];$$(".cmpck").forEach(c=>c.checked=false);updateCompareBar();
  $$("#runsList tr.row").forEach(tr=>tr.classList.toggle("sel",tr.dataset.id===runId));
  const det=$("#reportDetail");
  try{
    const d=await api(`/api/runs/${encodeURIComponent(runId)}/data`);
    det.style.display="block";
    $("#rdRunId").textContent=runId;
    $("#rdAdapter").textContent=d.metrics.adapter||"?";
    countUp($("#rdScore"),d.metrics.overall_score,v=>pct(v));
    animBars($("#rdCaps"),d.metrics.capability_scores);
    $("#rdRadar").src=`/api/runs/${encodeURIComponent(runId)}/radar?t=${Date.now()}`;
    renderVerdicts(d.verdicts);
    if(G){
      G.fromTo(det,{y:16,opacity:0},{y:0,opacity:1,duration:.5,ease:"power3.out"});
      G.fromTo("#rdRadar",{scale:.95,opacity:0},{scale:1,opacity:1,duration:.6,delay:.1,ease:"power3.out"});
    }
    det.scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){toast("读取失败："+e.message);}
}
function renderVerdicts(vs){
  const counts={};
  vs.forEach(v=>{const k=VMETA[v.verdict]?.[0]||v.verdict;counts[k]=(counts[k]||0)+1;});
  const chips=[["all",`全部 ${vs.length}`],
    ...Object.entries(counts).map(([k,n])=>[k,`${k} ${n}`])];
  $("#vChips").innerHTML=chips.map(([k,label])=>
    `<span class="chip ${k===vFilter||(vFilter==="all"&&k==="all")?"on":""}" data-k="${esc(k)}">${esc(label)}</span>`).join("");
  $$("#vChips .chip").forEach(c=>c.addEventListener("click",()=>{
    vFilter=c.dataset.k;renderVerdicts(vs);
    if(G){G.fromTo("#vBody tr",{opacity:0,y:6},{opacity:1,y:0,duration:.3,stagger:.02,ease:"power2.out"});}
  }));
  const rows=vs.filter(v=>vFilter==="all"||(VMETA[v.verdict]?.[0])===vFilter);
  $("#vBody").innerHTML=rows.map(v=>{
    const [label,cls]=VMETA[v.verdict]||[v.verdict,"dim"];
    return `<tr><td class="mono" style="font-size:12px">${esc(v.probe_id)}</td>
      <td style="font-size:12.5px">${esc(v.case_id||"")}</td>
      <td><span class="pill ${cls}">${label}</span></td>
      <td style="font-size:12px;color:var(--sub)">${esc(v.decided_by||"")}</td>
      <td class="exp" style="font-size:12.5px">${esc((v.explanation||"").slice(0,120))}</td></tr>`;}).join("");
  popIn($("#vBody").querySelectorAll(".pill"));
}

/* ---------- 配置 ---------- */
let cfgLoaded=false;
const CFG_GROUPS=[
  ["cfgVM",/^VM_/],["cfgAgent",/^AGENT_LLM_/],["cfgJudge",/^JUDGE_/],["cfgMisc",/^(KYLINBOT_SEND_INTERVAL|JUDGE_MIN_INTERVAL)$/]];
async function loadConfig(){
  try{
    const d=await api("/api/config");cfgLoaded=true;
    $("#cfgPath").textContent=d.env_path;
    for(const[grid,re]of CFG_GROUPS){
      const box=$("#"+grid);
      const items=d.items.filter(i=>re.test(i.key));
      box.innerHTML=items.map(i=>`
        <div class="cfg-item"><label>${esc(i.key)} ${i.set&&!i.value?'<span class="pill ok" style="font-size:10.5px">已设置</span>':""}</label>
          <input type="${["VM_PASS","AGENT_LLM_KEY","JUDGE_A_KEY","JUDGE_B_KEY"].includes(i.key)?"password":"text"}"
            data-k="${esc(i.key)}" value="${esc(i.value)}"
            placeholder="${i.set&&!i.value?"留空保持不变":""}"></div>`).join("");
    }
    staggerIn($$(".cfg-item"),{y:12,stagger:.04});
  }catch(e){toast("配置读取失败："+e.message);}
}
$("#btnSaveCfg").addEventListener("click",async()=>{
  const updates={};
  $$(".cfg-item input").forEach(inp=>{
    if(inp.value.trim()){updates[inp.dataset.k]=inp.value.trim();}});
  if(!Object.keys(updates).length){toast("没有改动");return}
  try{
    const r=await api("/api/config",{method:"POST",body:JSON.stringify({updates})});
    toast(`已保存 ${r.saved} 项到 .env`);loadConfig();
  }catch(e){toast("保存失败："+e.message);}
});

/* ---------- 通用 ---------- */
async function api(url,opts={}){
  const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opts});
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch{}throw Object.assign(new Error(m),{status:r.status});}
  return r.json();
}

/* ---------- 启动 ---------- */
window.addEventListener("load",()=>{
  initInk();
  if(G){G.timeline()
    .from(".brand",{y:-18,opacity:0,duration:.5,ease:"power3.out"})
    .from("#nav",{y:-12,opacity:0,duration:.45,ease:"power3.out"}, "-=.25")
    .from("#tab-doctor .card",{y:20,opacity:0,duration:.5,ease:"power3.out"}, "-=.2");
    G.from("#nav button",{y:8,opacity:0,duration:.3,stagger:.06,ease:"power2.out",delay:.15});
  }
  loadDoctor();loadCaseDirs();
});
window.addEventListener("resize",()=>{const b=$('#nav button.on');if(b)initInk();});
</script>
</body>
