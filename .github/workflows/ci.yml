# CI 门禁：题库 lint + 全量测试。
# 对应两类高频事故：数据侧（schema/防污染/覆盖矩阵/离线可判）与代码侧（e2e/适配器回归）。
# 平台矩阵 = Tier 2 证据：Tier 1 openKylin 的真机 systest（重启/拨钟/断网）在 VM 侧跑，
# GitHub 没有 openKylin runner，其证据链在 runs/ 产物与 systest 报告。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  # Windows runner 控制台默认 GBK，lint 打印 ⚠ / 报告路径会 UnicodeEncodeError
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Windows 开发环境；3.12 = openKylin 3.0 目标机
        python-version: ["3.11", "3.12"]
        # Windows = 开发/评测宿主；ubuntu = Tier 1 openKylin(Debian 系) 的代理验证
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（uv sync，--frozen 严格走 lockfile）
        run: uv sync --dev --frozen

      - name: 题库门禁 lint_cases.py
        run: uv run python scripts/lint_cases.py

      - name: 判卷离线自检（ScriptedJudge × 金标准，错判零容忍）
        run: uv run python scripts/judge_selftest.py --offline

      - name: 测试套件
        run: uv run pytest tests/ -q
