# 用例：动态更新 · 问答 + 记忆库双口径（update-001 的规则版姊妹题）
case_id: update-002
schema_version: "0.1"
capability: dynamic_update
question_type: info_update
content_type: path
difficulty: 1
tags: [seed, dual-probe]

meta:
  author: B
  created: 2026-09-28
  source: seed
  generator: null
  notes: "先说旧路径再改口，记忆库断言直接看存的是新值还是旧值"

phases:
  - name: inject
    steps:
      - user: "我的项目文档是 ~/docs/wiki"
      - user: "改到 ~/docs/wiki-v2 了，以后以这个为准"
  - name: confound
    steps:
      - user: "换个话题，UKUI 控制中心的账户头像能自定义吗？"
    end_session: true
  - name: probe
    steps:
      - user: "我的项目文档在哪？"

probes:
  - id: update-002-p1
    kind: judge
    after: probe
    ask: "我的项目文档在哪？"
    expect: "~/docs/wiki-v2"
    rubric: |
      只答新路径 ~/docs/wiki-v2 = 更新成功；
      答旧路径 ~/docs/wiki = 仍用被覆盖的旧值；不知道 = 遗漏；其他 = 编造。
    verdict_map:
      new_path: correct
      old_path: wrong_reuse
      dont_know: omission
      fabricated: fabrication
    anchors:
      - reply: "项目文档在 ~/docs/wiki-v2。"
        expect_verdict: new_path
      - reply: "你之前说是 ~/docs/wiki。"
        expect_verdict: old_path

  - id: update-002-p2
    kind: rule
    after: probe
    check:
      - assert: memory.contains
        args: ["~/docs/wiki-v2"]
        then: correct
      - assert: memory.contains
        args: ["~/docs/wiki$"]
        then: wrong_reuse
      - assert: default
        then: omission
    evidence_ref: ["memory_snapshot"]
