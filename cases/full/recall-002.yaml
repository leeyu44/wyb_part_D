# 用例：记忆调用 · 陈述式事实注入（无显式"记住"指令），考主动记忆
case_id: recall-002
schema_version: "0.1"
capability: recall
question_type: cross_session_recall
content_type: fact
difficulty: 2
tags: [seed, fact-style]

meta:
  author: B
  created: 2026-09-28
  source: seed
  generator: null
  notes: "没有'是/用/放在'句式的自然陈述，mock 不写入 -> 预期遗漏样本"

phases:
  - name: inject
    steps:
      - user: "麒麟座内核版本定为 3.2-rc1"
  - name: confound
    steps:
      - user: "聊聊别的，截图工具默认保存到哪？"
    end_session: true
  - name: probe
    steps:
      - user: "我的麒麟座内核版本是什么？"

probes:
  - id: recall-002-p1
    kind: judge
    after: probe
    ask: "我的麒麟座内核版本是什么？"
    expect: "3.2-rc1"
    rubric: |
      答出 3.2-rc1 = 记住并调用成功；不知道/没提过 = 遗漏；
      编一个别的版本号 = 记错（编造）。
    verdict_map:
      reported: correct
      forgot: omission
      made_up: fabrication
    anchors:
      - reply: "麒麟座内核版本是 3.2-rc1。"
        expect_verdict: reported
      - reply: "这个我不记得了。"
        expect_verdict: forgot
      - reply: "好像是 3.0 正式版。"
        expect_verdict: made_up
